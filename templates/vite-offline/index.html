<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>__GAME_NAME__</title>
    <!-- Icon inline: không có thì trình duyệt xin /favicon.ico → 404 → G2 (0 lỗi console) fail. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1020'/%3E%3Crect x='11' y='20' width='10' height='6' fill='%237dfcd0'/%3E%3Crect x='6' y='6' width='12' height='5' fill='%23ff6b8b'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="stage">
      <canvas id="scene" aria-label="Sân chơi"></canvas>
      <header id="hud">
        <div><div>Giây</div><div class="big" id="time">0</div></div>
        <div style="text-align:right"><div>Kỷ lục</div><div class="big" id="best">0</div></div>
      </header>
      <div class="pad">
        <button id="left" type="button" aria-label="Sang trái">◀</button>
        <button id="right" type="button" aria-label="Sang phải">▶</button>
      </div>
      <div id="overlay">
        <h1 id="title">__GAME_NAME__</h1>
        <p id="sub">Né khối rơi. Sống đủ 60 giây là thắng.</p>
        <button id="play" type="button">Chơi</button>
      </div>
    </div>
    <!-- Platform: SDK (vendor) + cầu nối. Ngoài platform cả hai im lặng. -->
    <script>window.ARCADE_GAME_ID = '__GAME_ID__';</script>
    <script src="vendor/arcade.js"></script>
    <script src="arcade-bridge.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
